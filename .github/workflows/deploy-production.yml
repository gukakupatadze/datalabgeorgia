name: Build and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building the images
        required: true
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - component: admin-frontend
            context: ./admin-panel/frontend
            dockerfile: ./admin-panel/frontend/Dockerfile
          - component: backend
            context: ./admin-panel/backend
            dockerfile: ./admin-panel/backend/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ matrix.component }}-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:${{ matrix.component }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to VPS
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      PRODUCTION_ENV_FILE_B64: ${{ secrets.PRODUCTION_ENV_FILE_B64 }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/datalabgeorgia' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS GHCR_PULL_TOKEN PRODUCTION_ENV_FILE_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment secret: ${name}" >&2
              exit 1
            fi
          done
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "VPS_PORT must be numeric" >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH must be a safe absolute path" >&2; exit 1; }
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "GHCR_USERNAME contains invalid characters" >&2; exit 1; }

      - name: Prepare runtime environment and release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          RUNTIME_ENV="$RUNNER_TEMP/production.env"
          printf '%s' "$PRODUCTION_ENV_FILE_B64" | base64 --decode > "$RUNTIME_ENV"

          for name in SITE_ADDRESS MONGO_URL DB_NAME BACKEND_URL FRONTEND_URL CORS_ORIGINS INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD COOKIE_SECURE; do
            if ! grep -qE "^${name}=.+" "$RUNTIME_ENV"; then
              echo "PRODUCTION_ENV_FILE_B64 is missing ${name}" >&2
              exit 1
            fi
          done
          if grep -qE '^(IMAGE_REPOSITORY|IMAGE_TAG)=' "$RUNTIME_ENV"; then
            echo "IMAGE_REPOSITORY and IMAGE_TAG are managed by the workflow" >&2
            exit 1
          fi

          printf '\nIMAGE_REPOSITORY=%s\nIMAGE_TAG=%s\n' "$IMAGE_REPOSITORY" "$GITHUB_SHA" >> "$RUNTIME_ENV"
          tar -czf "$RUNNER_TEMP/release.tgz" \
            compose.yaml \
            deploy/Caddyfile \
            frontend/Dockerfile \
            frontend/nginx.conf \
            admin-panel/frontend/Dockerfile \
            admin-panel/frontend/nginx.conf \
            admin-panel/backend/Dockerfile \
            admin-panel/backend/requirements-prod.txt

      - name: Configure trusted SSH connection
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_TARGET="${VPS_USER}@${VPS_HOST}"
          ssh -p "$VPS_PORT" "$SSH_TARGET" "install -d -m 750 '$DEPLOY_PATH'"
          scp -P "$VPS_PORT" "$RUNNER_TEMP/release.tgz" "$SSH_TARGET:$DEPLOY_PATH/.release.tgz"
          scp -P "$VPS_PORT" "$RUNNER_TEMP/production.env" "$SSH_TARGET:$DEPLOY_PATH/.env.next"

      - name: Authenticate VPS to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Start production release
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          tar -xzf .release.tgz
          rm -f .release.tgz
          chmod 600 .env.next

          if [[ -f .env ]]; then
            cp .env .env.previous
          fi
          mv .env.next .env

          if ! docker compose --env-file .env config --quiet; then
            if [[ -f .env.previous ]]; then cp .env.previous .env; fi
            exit 1
          fi

          if ! docker compose --env-file .env pull || \
             ! docker compose --env-file .env up -d --no-build --remove-orphans --wait --wait-timeout 180; then
            echo "Deployment failed; attempting the previous image set" >&2
            if [[ -f .env.previous ]]; then
              cp .env.previous .env
              docker compose --env-file .env pull
              docker compose --env-file .env up -d --no-build --remove-orphans --wait --wait-timeout 180
            fi
            exit 1
          fi

          docker image prune -f
          docker compose --env-file .env ps
          REMOTE
