name: datalabgeorgia

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in the production environment file}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}:frontend-${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - app
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  admin-frontend:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}:admin-frontend-${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ./admin-panel/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/admin/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}:backend-${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ./admin-panel/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_PATH:-./.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - app
      - database
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1",
        ]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 10s
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:
  app:
    internal: true
  database:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
